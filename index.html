<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tigo Garage</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <main>

        <h1>Tigo Garage</h1>

        <h2>The Power of Sequencing</h2>

        <p class="description">
            The same three images can tell two completely different stories.
        </p>


        <h3 id="story-title">
            Sequence 1: Tigo the Mechanic
        </h3>


        <div class="sequence">

            <div class="scene">
                <img
                    id="image1"
                    src="./z1.png"
                    alt="Damaged 370Z"
                >

                <p id="caption1">
                    The 370Z is damaged.
                </p>
            </div>


            <div class="arrow">
                →
            </div>


            <div class="scene">
                <img
                    id="image2"
                    src="./z2.png"
                    alt="Tigo repairing the 370Z"
                >

                <p id="caption2">
                    Tigo tries to repair it.
                </p>
            </div>


            <div class="arrow">
                →
            </div>


            <div class="scene">
                <img
                    id="image3"
                    src="./z3.png"
                    alt="Fixed 370Z"
                >

                <p id="caption3">
                    The 370Z is fixed!
                </p>
            </div>

        </div>


        <p id="story-description">
            Tigo repairs the damaged 370Z and brings it back to life.
        </p>


        <div class="buttons">

            <button id="mechanic-button">
                Tigo the Mechanic
            </button>

            <button id="problem-button">
                Tigo the Problem
            </button>

        </div>

    </main>


    <script src="./script.js"></script>

</body>

</html>
